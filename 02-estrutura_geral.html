<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-image: url(paw-solid.svg);
      background-size: 50px;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    main {
      background-color: rgba(255, 255, 255, 0.9);
    }
    h1, h2 {
      background-color: rgb(200, 220, 255);
      color: darkblue;
    }
    h6 {
      color: #666;
    }
    main {
        background-color: rgba(255, 255, 255, 0.9);
        width: 1024px;
        padding: 10px;
        margin: auto;
    }
    nav ul {
        height: 38px;
        list-style: none;
        padding: 0;
        border: 2px solid rgba(31, 50, 112, 0.3);
        background-color: #fff;
    }
    nav ul li {
        float: left;
        border-left: 1px solid rgba(31, 50, 112, 0.3);
        border-right: 1px solid rgba(31, 50, 112, 0.3);
    }
    nav ul li a {
    color: darkblue;
    text-decoration: none;
    font-size: 1.2em;
    padding: 8px 55px;
    line-height: 2em;
    text-align: center;    
    }
    aside {
        float: right;
        background-color: #fff;
        padding: 15px;
        color: darkblue;
        border: 1px solid rgba(31, 50, 112, 0.3);
        border-radius: 5% 20%;
    }
    aside img {
        width: 32px;
        padding: 3px;
    }
    aside a {
        text-decoration: none;
    }
    nav ul li:first-child {
        border-left: none;
    }
    nav ul li:nth-last-child {
        border-right: none;
    }
    nav ul li a:hover {
        background-color: darkblue;
        color: #fff;
    }
    aside a:hover {
        background-color: rgba(31, 50, 112, 0.3);
    }
  </style>
</head>
<body>
  <main>
    <nav>

            nos acompanhe:

            </a>
            <a href=“https://www.instagram.com/senacsaopaulo/” target=“_blank”>
                <img src="square-instagram-brands-solid.svg" alt="instagram" />
                </a>
                <a href="https://www.youtube.com/user/senacsaopaulo"target="_blank">

</html>
